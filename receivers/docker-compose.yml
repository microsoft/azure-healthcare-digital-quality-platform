# Runs the receivers stack of the Azure Healthcare Digital Quality
# accelerator locally:
#   * postgres      - PostgreSQL store for SQL-backed CQL execution
#   * orchestrator  - FastAPI / MCP engine for receiver-side workflows
#   * backend       - FastAPI API + DEQM ingest router
#   * frontend      - Nginx-served Vite/React UI
#
# From receivers/:
#   docker compose up --build
#
# Build contexts use the repository root. The orchestrator also receives the
# sibling CQL SDK as a named build context so local builds exercise the
# un-released PostgreSQL backend.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dq_receivers}
      POSTGRES_USER: ${POSTGRES_USER:-dq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dq}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dq-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  orchestrator:
    build:
      context: ..
      dockerfile: database/Dockerfile.orchestrator-local
      args:
        STACK: receivers
      additional_contexts:
        cql_sdk: ../../azure-healthcare-digital-quality-cql-sdk
    image: azure-healthcare-digital-quality-receivers-orchestrator:local
    env_file:
      - ./orchestrator/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dq}@postgres:5432/${POSTGRES_DB:-dq_receivers}
      - PGPASSWORD=${POSTGRES_PASSWORD:-dq}
    ports:
      - "8011:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dq-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: receivers/backend/Dockerfile
    image: azure-healthcare-digital-quality-receivers-backend:local
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DIGITAL_QUALITY_ORCHESTRATOR_BASE_URL=http://orchestrator:8000
      - DIGITAL_QUALITY_ORCHESTRATOR_AI_TIMEOUT_SECONDS=180
      - DEVELOPMENT_MODE=true
    ports:
      - "8010:5000"
    depends_on:
      orchestrator:
        condition: service_started
    networks:
      dq-net:
        aliases:
          - backend.dq.svc.cluster.local

  frontend:
    build:
      context: ./frontend
    image: azure-healthcare-digital-quality-receivers-frontend:local
    env_file:
      - ./frontend/.env
    ports:
      - "5183:80"
    depends_on:
      - backend
    networks:
      - dq-net

networks:
  dq-net:
    driver: bridge

volumes:
  postgres-data:

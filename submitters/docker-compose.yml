# Runs the submitters stack of the Azure Healthcare Digital Quality
# accelerator locally:
#   * postgres      - PostgreSQL store for SQL-backed CQL execution
#   * orchestrator  - FastAPI quality-measure / MCP engine (internal port 8000)
#   * backend       - FastAPI API + DEQM router            (internal port 5000)
#   * frontend      - Nginx-served Vite/React UI           (internal port 80)
#
# The frontend's nginx.conf proxies /api/ and /fhir/ to the in-cluster DNS
# name `backend.dq.svc.cluster.local`, so the backend is given that name as
# a network alias - no template edits needed.
#
# From submitters/:
#   docker compose up --build
#
# Build contexts are set to `..` (the repo root) because the backend and
# orchestrator Dockerfiles COPY from repository-root paths. The orchestrator
# also receives the sibling CQL SDK as a named build context so local builds
# exercise the un-released PostgreSQL backend.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-dq_submitters}
      POSTGRES_USER: ${POSTGRES_USER:-dq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dq}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../database/init:/docker-entrypoint-initdb.d:ro
    networks:
      - dq-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  orchestrator:
    build:
      context: ..
      dockerfile: database/Dockerfile.orchestrator-local
      args:
        STACK: submitters
      additional_contexts:
        cql_sdk: ../../azure-healthcare-digital-quality-cql-sdk
    image: azure-healthcare-digital-quality-submitters-orchestrator:local
    env_file:
      - ./orchestrator/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://${POSTGRES_USER:-dq}@postgres:5432/${POSTGRES_DB:-dq_submitters}
      - PGPASSWORD=${POSTGRES_PASSWORD:-dq}
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - dq-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: submitters/backend/Dockerfile
    image: azure-healthcare-digital-quality-submitters-backend:local
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      # Point the backend at the orchestrator using its compose DNS name
      - DIGITAL_QUALITY_ORCHESTRATOR_BASE_URL=http://orchestrator:8000
      - DIGITAL_QUALITY_ORCHESTRATOR_AI_TIMEOUT_SECONDS=180
      # Local-only: allow anonymous calls so docker-compose smoke tests work
      - DEVELOPMENT_MODE=true
    ports:
      - "8000:5000"
    depends_on:
      orchestrator:
        condition: service_started
    networks:
      dq-net:
        # Alias so the frontend's production nginx.conf can resolve the
        # in-cluster DNS name without modification.
        aliases:
          - backend.dq.svc.cluster.local

  frontend:
    build:
      context: ./frontend
    image: azure-healthcare-digital-quality-submitters-frontend:local
    env_file:
      - ./frontend/.env
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - dq-net

networks:
  dq-net:
    driver: bridge

volumes:
  postgres-data:
